<style>
/* Layout: dark "beit midrash at night" shell in Lau Center gold, parchment cards for reading; one-column flow, wizard as a focused sheet. */
:root{
  --ink:#16100b; --ink-2:#201710; --ink-3:#2c2017; --ink-4:#3a2b1f;
  --gold:#c9a24a; --gold-hi:#ecd391; --gold-lo:#8d6c2c;
  --cream:#efe4cf; --cream-dim:#bfb19a; --cream-faint:#8e806b;
  --parch:#f5eddd; --parch-2:#ebdfc8; --parch-ink:#2a1d13; --parch-mute:#6b5a46;
  --flame:#e48a3c; --ok:#7fb57a; --warn:#e0a54a;
  --line:rgba(236,211,145,.16); --line-strong:rgba(236,211,145,.38);
  --f-display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-body:"Assistant","Heebo","Segoe UI",Arial,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--gold-hi)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gold-text{background:linear-gradient(100deg,var(--gold-lo),var(--gold-hi) 45%,var(--gold) 70%,var(--gold-hi));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
[dir=rtl] .eyebrow{letter-spacing:.04em}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:70px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--cream);background:none;border:0;padding:0}
.brand-logo{height:42px;width:auto;display:block}
.nav{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
.nav a{color:var(--cream-dim);text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:15px}
.nav a:hover{color:var(--gold-hi)}
.nav a.on{color:var(--gold-hi)}
.lang{border:1px solid var(--line-strong);background:transparent;color:var(--cream);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.nav a{white-space:nowrap}.nav .show-sm{display:none}
@media (max-width:760px){.nav .hide-sm{display:none}.nav .show-sm{display:inline}.nav a{padding:8px 6px}.brand-logo{height:36px}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:14px 26px;font-weight:800;font-size:17px;border:0;text-decoration:none;transition:transform .15s ease,box-shadow .2s ease}
.btn-gold{color:#20160d;background:linear-gradient(110deg,var(--gold-lo),var(--gold-hi) 40%,var(--gold) 60%,var(--gold-hi));background-size:220% 100%;box-shadow:0 8px 30px -10px rgba(236,211,145,.55);animation:sheen 6s ease-in-out infinite}
.btn-gold:hover{transform:translateY(-2px)}
.btn-ghost{color:var(--cream);background:transparent;border:1px solid var(--line-strong)}
.btn-ghost:hover{border-color:var(--gold-hi);color:var(--gold-hi)}
.btn-sm{padding:9px 16px;font-size:15px;white-space:nowrap}
.btn[disabled]{opacity:.4;cursor:not-allowed;animation:none}
@keyframes sheen{0%,100%{background-position:0 0}50%{background-position:100% 0}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 105%,rgba(228,138,60,.22),transparent 70%),radial-gradient(ellipse 50% 50% at 50% 0,rgba(201,162,74,.10),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:44px 60px;display:grid;gap:26px;justify-items:center;text-align:center}
.hero h1{font-size:clamp(34px,6.4vw,78px);font-weight:900;letter-spacing:-.01em;display:grid;gap:.08em}
.hero h1 .l1{color:var(--cream)}
.hero h1 .l1,.hero h1 .l2{display:block}
.hero-logo{width:min(400px,78vw);height:auto;filter:drop-shadow(0 10px 40px rgba(228,138,60,.25))}
.hero .lead{font-size:clamp(17px,2.2vw,22px);color:var(--cream-dim);display:grid;gap:6px;justify-items:center}
.hero .lead-1{color:var(--cream);font-weight:800;display:block;font-size:clamp(15px,4vw,22px)}
.hero .lead-2{display:block;max-width:72ch}
.hero .invite{font-family:var(--f-display);font-size:clamp(17px,2.4vw,26px);color:var(--gold-hi);border-block:1px solid var(--line-strong);padding-block:12px;padding-inline:8px;display:grid;gap:2px}
.ln{display:block}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.countdown{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;color:var(--cream-dim);font-size:15px}
.countdown .days{font-family:var(--f-display);font-size:30px;color:var(--gold-hi);font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--cream-dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--flame);box-shadow:0 0 0 0 rgba(228,138,60,.6);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,138,60,.55)}70%{box-shadow:0 0 0 10px rgba(228,138,60,0)}100%{box-shadow:0 0 0 0 rgba(228,138,60,0)}}

/* ---------- sections ---------- */
section.band{padding-block:84px}
.band-head{display:grid;gap:12px;max-width:720px;margin-bottom:40px}
.band-head h2{font-size:clamp(30px,4.4vw,48px)}
.band-head p{color:var(--cream-dim);font-size:19px}
.parch{background:var(--parch);color:var(--parch-ink)}
.parch .band-head p{color:var(--parch-mute)}
.parch .eyebrow{color:var(--gold-lo)}

.shas{background:radial-gradient(ellipse 60% 80% at 85% 50%,rgba(201,162,74,.12),transparent 70%),var(--ink-2);border-bottom:1px solid var(--line)}
.shas-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:56px;align-items:center}
.shas-date{border:1.5px solid var(--line-strong);border-radius:20px;padding:30px 24px;text-align:center;display:grid;gap:6px;background:var(--ink)}
.shas-day{font-size:18px;color:var(--cream-dim);font-weight:700}
.shas-heb{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,5vw,56px);line-height:1.05}
.shas-greg{font-family:var(--f-display);font-size:22px;color:var(--cream)}
.shas-text{display:grid;gap:14px}
.shas-text h2{font-size:clamp(28px,4vw,44px)}
.shas-text p{color:var(--cream-dim);font-size:19px;max-width:60ch}
.shas-text .shas-punch{font-family:var(--f-display);font-size:clamp(22px,2.8vw,28px);color:var(--gold-hi)}
@media (max-width:820px){.shas-grid{grid-template-columns:1fr;gap:28px}}
.sinai{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.big-num{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,12vw,150px);line-height:.9;font-variant-numeric:tabular-nums}
.big-num-sub{font-family:var(--f-display);font-size:26px;color:var(--gold-lo);margin-top:10px}
.sinai p{font-size:19px;color:var(--parch-mute);max-width:52ch}
.sinai p+p{margin-top:14px}
.sinai .quote{font-family:var(--f-display);font-size:24px;color:var(--parch-ink);border-inline-start:3px solid var(--gold);padding-inline-start:18px;margin-top:22px}
@media (max-width:820px){.sinai{grid-template-columns:1fr;gap:28px}}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
@media (max-width:1000px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:linear-gradient(180deg,var(--ink-2),var(--ink));display:grid;gap:10px;align-content:start}
.step .n{font-family:var(--f-display);font-size:42px;color:var(--gold);line-height:1}
.step h3{font-size:24px}
.step p{color:var(--cream-dim)}
@media (max-width:620px){.steps{grid-template-columns:1fr}}

.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.track{position:relative;border-radius:18px;padding:28px 24px 24px;background:var(--parch-2);display:grid;gap:12px;align-content:start;color:var(--parch-ink);overflow:hidden}
.track .glyph{width:56px;height:56px}
.track h3{font-size:32px;font-weight:900}
.track .en{font-size:12px;letter-spacing:.16em;color:var(--gold-lo);font-weight:800}
.track .promise{font-weight:700;font-size:18px}
.track ul{margin:0;padding-inline-start:18px;color:var(--parch-mute);display:grid;gap:4px}
.angel{margin-top:18px;border:1.5px dashed var(--gold-lo);border-radius:18px;padding:24px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.angel h3{font-size:26px}
.angel p{color:var(--parch-mute)}
@media (max-width:820px){.tracks{grid-template-columns:1fr}.angel{grid-template-columns:1fr}}

.subjects{display:flex;flex-wrap:wrap;gap:10px}
.subj-chip{border:1px solid var(--line-strong);border-radius:999px;padding:10px 18px;font-weight:700;color:var(--cream);background:transparent;font-size:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.subj-chip:hover{border-color:var(--gold-hi);background:rgba(236,211,145,.08);transform:translateY(-1px)}
.track{cursor:pointer;transition:transform .15s,box-shadow .15s;border:0;font:inherit}
.track:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.track .go{margin-top:6px;font-weight:800;color:var(--gold-lo)}
.subj-chip span{color:var(--cream-faint);font-weight:400;margin-inline-start:6px;font-size:14px}

.road{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:20px}
.road::before{content:"";position:absolute;inset-inline:6%;top:23px;height:2px;background:var(--line-strong)}
.road .prog{position:absolute;inset-inline-start:6%;top:23px;height:2px;background:linear-gradient(90deg,var(--gold),var(--flame));width:0}
.ms{position:relative;display:grid;justify-items:center;text-align:center;gap:6px;padding-inline:6px}
.ms .node{width:48px;height:48px;border-radius:50%;background:var(--ink-2);border:2px solid var(--line-strong);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--gold-hi);z-index:1}
.ms.last .node{background:linear-gradient(135deg,var(--gold-lo),var(--gold-hi));color:#20160d;border:0}
.ms h4{font-size:22px;margin-top:6px}
.ms .date{color:var(--cream-faint);font-size:14px}
.ms .goal{font-family:var(--f-display);font-size:22px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.road-note{color:var(--cream-faint);font-size:14px;margin-top:22px;text-align:center}
@media (max-width:700px){.road{grid-template-columns:1fr 1fr;row-gap:28px}.road::before,.road .prog{display:none}}

.lead-band{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:center}
.lead-band img{width:min(420px,100%);height:auto}
.lead-band p{color:var(--cream-dim);font-size:18px;max-width:58ch}
.lead-band p+p{margin-top:12px}
@media (max-width:820px){.lead-band{grid-template-columns:1fr;gap:24px}}

.final{text-align:center;display:grid;gap:22px;justify-items:center}
.final h2{font-size:clamp(34px,5.4vw,60px);font-weight:900;max-width:18ch}

footer{border-top:1px solid var(--line);padding-block:36px;color:var(--cream-faint);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
footer img{height:44px;width:auto}
.foot-logos{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.foot-atgar{height:56px!important}
.foot-contact{display:grid;gap:4px}
footer a{color:var(--cream-dim)}

/* ---------- wizard ---------- */
.view{display:none}
.view.on{display:block}
.wiz{padding-block:36px 90px}
.wiz-shell{max-width:860px;margin-inline:auto}
.stepper{display:flex;gap:6px;margin-bottom:28px}
.stepper i{flex:1;height:5px;border-radius:5px;background:var(--ink-4)}
.stepper i.done{background:var(--gold)}
.stepper i.cur{background:linear-gradient(90deg,var(--gold),var(--flame))}
.wiz-meta{display:flex;justify-content:space-between;align-items:center;color:var(--cream-faint);font-size:14px;margin-bottom:10px}
.back{background:none;border:0;color:var(--cream-dim);font-weight:700;padding:6px 0}
.back:hover{color:var(--gold-hi)}
.wiz h2{font-size:clamp(28px,4.4vw,44px);margin-bottom:10px}
.wiz .sub{color:var(--cream-dim);font-size:18px;margin-bottom:28px;max-width:60ch}
.choice-grid{display:grid;gap:14px}
.choice-grid.c3{grid-template-columns:repeat(3,1fr)}
.choice-grid.c2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.choice-grid.c3,.choice-grid.c2{grid-template-columns:1fr}}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;align-content:start;padding:22px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--ink-2);transition:border-color .15s,transform .15s,background .15s;text-align:start}
.choice:hover{border-color:var(--gold-lo);transform:translateY(-2px)}
.choice:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.choice.sel{border-color:var(--gold-hi);background:linear-gradient(180deg,rgba(201,162,74,.16),var(--ink-2))}
.choice h3{font-size:26px}
.choice .k{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.choice p{color:var(--cream-dim);font-size:15.5px}
.choice .amt{font-family:var(--f-display);color:var(--gold-hi);font-size:18px}
.choice.custom{border-style:dashed;grid-column:1/-1}

/* ---------- learning catalog, subject pages, reader ---------- */
.learn{padding-block:30px 90px}
.crumb{margin-bottom:8px;font-size:15px}
.learn-hero{display:grid;gap:12px;justify-items:start;padding-block:10px 26px;border-bottom:1px solid var(--line);margin-bottom:10px}
.learn-hero h1{font-family:var(--f-display);font-size:clamp(34px,5.4vw,58px);line-height:1.08}
.learn-hero h1 .ln{display:block}
.learn-hero h1 .ln:nth-child(2){color:var(--gold-hi)}
.learn-hero h1 .ln:nth-child(3){color:var(--cream-dim)}
.learn-hero p{color:var(--cream-dim);font-size:19px;max-width:62ch}
.learn-sec{padding-block:30px;border-bottom:1px solid var(--line)}
.learn-sec:last-child{border-bottom:0}
.learn-sec>h2{font-family:var(--f-display);font-size:clamp(26px,3.4vw,36px);margin-bottom:6px}
.learn-sub{color:var(--cream-dim);margin-bottom:20px;max-width:62ch}
.lvl-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lvl-card{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:20px}
.lvl-card ul{margin:12px 0 0;padding-inline-start:20px;color:var(--cream-dim);font-size:15.5px;display:grid;gap:4px}
.lvl-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.lvl-head .k{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.lvl-head h3{font-family:var(--f-display);font-size:26px;line-height:1.1}
.lvl-head p{color:var(--cream-dim);font-size:15px}
.lvl-card .lvl-head{margin-bottom:0}
.subj-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.subj-card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;align-content:start;padding:22px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--ink-2);text-align:start;transition:border-color .15s,transform .15s}
.subj-card:hover{border-color:var(--gold-lo);transform:translateY(-2px)}
.subj-card:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.subj-card .k{font-size:13px;color:var(--gold);font-weight:800}
.subj-card h3{font-family:var(--f-display);font-size:28px;line-height:1.1}
.subj-card p{color:var(--cream-dim);font-size:15px}
.subj-card .meta{color:var(--cream-faint);font-size:14px}
.subj-card .go{color:var(--gold-hi);font-weight:700;font-size:15px}
.subj-card.custom{border-style:dashed}
.ltable-wrap{margin-bottom:26px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--ink-2)}
.ltable-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.ltable-head h3{font-family:var(--f-display);font-size:24px}
.ltable-head h3 span{font-family:var(--f-body);font-size:15px;color:var(--cream-faint);font-weight:400;margin-inline-start:6px}
.ltable{width:100%;border-collapse:collapse;font-size:15.5px}
.ltable th{text-align:start;color:var(--cream-faint);font-weight:700;font-size:13px;padding:10px 18px;background:var(--ink-3)}
.ltable td{padding:10px 18px;border-top:1px solid var(--line);color:var(--cream-dim);vertical-align:top}
.ltable tr.first td{border-top-color:var(--line-strong)}
.ltable td.lv{color:var(--gold);font-weight:800;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--cream);font:inherit;font-weight:700;text-align:start;cursor:pointer}
.link:hover{color:var(--gold-hi);text-decoration:underline}
@media (max-width:760px){
  .lvl-cards,.subj-cards{grid-template-columns:1fr}
  .ltable thead{display:none}
  .ltable,.ltable tbody,.ltable tr,.ltable td{display:block;width:100%}

.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.opt-card .k{font-size:12px;color:var(--gold);font-weight:800}
.opt-card h3{font-family:var(--f-display);font-size:23px;line-height:1.2}
.opt-facts{display:grid;gap:2px;color:var(--cream-dim);font-size:14.5px}
.opt-facts b{color:var(--cream);font-weight:700}
.opt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.reader{max-width:820px;margin-inline:auto;margin-top:10px;border-radius:18px;background:var(--parch);color:var(--parch-ink);padding:clamp(20px,4vw,44px)}
.reader-load{color:var(--parch-mute);margin-bottom:14px}
.reader-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;border-bottom:1px solid rgba(42,29,19,.15);padding-bottom:16px;margin-bottom:18px}

.reader h1{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1.15}

.reader .btn-ghost:hover{color:var(--gold-lo);border-color:var(--gold-lo)}
.reader-text{list-style-type:hebrew;font-family:var(--f-display);font-size:clamp(20px,2.4vw,23px);line-height:1.85;margin:0;padding-inline-start:1.6em;display:grid;gap:12px}
.reader-text li::marker{color:var(--gold-lo);font-family:var(--f-body);font-size:.7em;font-weight:700}
.reader-nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.reader-src{margin-top:20px;font-size:13px;color:var(--parch-mute)}
.reader-cta{max-width:820px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- free choice: book + chapter picker ---------- */
.free-panel{display:grid;gap:14px}
.free-panel select{width:100%;max-width:420px}
.free-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.free-head span{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.free-head label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--cream-dim)}
.free-head input{width:76px;padding:6px 8px}
.u-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:340px;overflow:auto;padding:2px}
.u-grid.parts{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.u-chip{font:inherit;font-size:15px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);color:var(--cream);cursor:pointer;text-align:center;line-height:1.25}
.u-grid.parts .u-chip{text-align:start;padding:8px 12px;font-size:14px}
.u-chip:hover{border-color:var(--gold-lo)}

.u-chip.done{background:rgba(120,170,120,.18);border-color:rgba(140,190,140,.6);color:var(--cream)}
.u-chip:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.free-count,.free-note{color:var(--cream-dim);font-size:15px}
.choice.free-card{grid-column:1/-1;border-style:dashed}

.panel{border:1px solid var(--line);border-radius:18px;background:var(--ink-2);padding:24px}
.form{display:grid;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

.field{display:grid;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:700;font-size:15px;color:var(--cream)}
.field .hint{font-size:13px;color:var(--cream-faint)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],select,textarea{font:inherit;color:var(--cream);background:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:11px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(236,211,145,.15)}
.seg{display:flex;flex-wrap:wrap;gap:8px}

.seg button.sel{background:var(--gold);color:#20160d;border-color:var(--gold)}

.gbtn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:16px;font-family:var(--f-body)}

.goal-box{display:grid;gap:18px}

.preview-msg{max-width:340px;background:#1f2c26;color:#e8efe9;border-radius:14px;border-start-start-radius:4px;padding:10px 14px;font-size:15px;line-height:1.5;box-shadow:0 6px 18px -8px #000}
.preview-msg small{display:block;text-align:end;color:#9fb3a8;font-size:12px;margin-top:4px}

.cert{position:relative;background:var(--parch);color:var(--parch-ink);border-radius:20px;padding:44px 36px;text-align:center;display:grid;gap:14px;justify-items:center;overflow:hidden;box-shadow:0 30px 80px -40px rgba(236,211,145,.5)}
.cert::before{content:"";position:absolute;inset:12px;border:1.5px solid var(--gold);border-radius:12px;pointer-events:none}

/* Demo store: keeps everything in this browser only. Used for the preview artifact. */
(function(){
  const KEY = "atgar_demo_v1";
  let db = {auth:null, me:null, commitments:[]};
  try{ const r = localStorage.getItem(KEY); if(r) db = Object.assign(db, JSON.parse(r)); }catch(e){}
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} };
  let authCb = () => {};
  window.Store = {
    mode: "demo",
    init(cb){ authCb = cb; setTimeout(() => cb(db.auth), 0); },
    async signInGoogle(){ return "demo"; },
    async signUpEmail(name, email){
      db.auth = {uid:"demo", name, email, photo:"", verified:false};
      if(!db.me) db.me = {code: Math.random().toString(36).slice(2,8), invitesCount:0, reminderActive:true};
      save(); authCb(db.auth);
    },
    async signInEmail(email){
      if(db.saved && db.saved.email===email){ db.auth = Object.assign({}, db.saved); save(); authCb(db.auth); return; }
      const e = new Error("demo"); e.code = "auth/invalid-credential"; throw e;
    },
    async resetPassword(){},
    async resendVerification(){},
    async checkVerified(){ if(db.auth){ db.auth.verified = true; db.saved = Object.assign({}, db.auth); save(); authCb(db.auth); } return true; },
    async sendEmailLink(){ throw new Error("demo"); },
    needsEmailForLink(){ return false; },
    async finishEmailLink(){},
    async signOut(){ db.auth = null; save(); authCb(null); },
    async loadMe(){ return db.me; },
    async loadCommitments(){ return db.commitments.slice(); },
    async commit({profile, rem, consent, ref, name, lang, commitment}){
      db.me = Object.assign(db.me||{}, {profile, rem, consentAt:new Date().toISOString(), lang, reminderActive:true});
      if(ref && !db.me.ref) db.me.ref = ref;
      if(name) db.auth.name = name;
      const c = Object.assign({id: Date.now().toString(36), done:0, createdAt:new Date().toISOString()}, commitment);
      db.commitments.push(c); save(); return c.id;
    },
    async updateProgress(id, done, doneSel){ const c = db.commitments.find(x=>x.id===id); if(c){ c.done = done; if(typeof doneSel==="string") c.doneSel = doneSel; save(); } },
    async updatePhone(phone){ db.me.profile = Object.assign({}, db.me.profile, {phone}); save(); },
    async updateReminders(rem, active){ db.me.rem = rem; db.me.reminderActive = active; save(); },
    watchStats(){ /* no live stats in demo */ },
    async communityCount(){ return null; }
  };
})();

const BOOKS = window.BOOKS || {};

const partsCache = {};
function bookOf(subj, bi){ const b=(BOOKS[subj]||[])[bi]; if(!b) return null; return {i:+bi, t:b[0], he:b[1], kind:b[2], n:b[3]||0, sec:b[4]||"", start:b[5]||(b[2]==="daf"?2:1)}; }
function bookByTitle(subj, title){ const i=(BOOKS[subj]||[]).findIndex(b=>b[0]===title); return i<0 ? null : bookOf(subj,i); }
async function loadParts(title){
  if(partsCache[title]) return partsCache[title];
  const d = await fetch("https://www.sefaria.org/api/shape/"+encodeURIComponent(title)).then(r=>r.json());
  const sh = Array.isArray(d) ? d[0] : d; const bookHe = (sh && (sh.heBook||sh.heTitle)) || "";
  const parts = ((sh && sh.chapters) || []).filter(c=>c && typeof c==="object" && (c.length || (Array.isArray(c.chapters) ? c.chapters.some(x=>x) : c.chapters>0)))
    .map(c=>({t:c.title, he:String(c.heTitle||c.title).replace(bookHe+", ","")}));
  if(!parts.length) throw new Error("no parts");
  partsCache[title]=parts; return parts;
}
function unitIds(b, parts){ if(b.kind==="part") return (parts||[]).map((_,i)=>i+1); const out=[]; for(let i=b.start;i<=b.n;i++) out.push(i); return out; }
function numFmt(id, L){ return (L||lang)==="he" ? gem(id) : String(id); }
function unitName(b, id, parts, L){ L=L||lang; if(b.kind==="part"){ const p=parts&&parts[id-1]; return p ? (L==="he"?p.he:p.t) : "#"+id; } return numFmt(id, L); }
function unitRef(b, id, parts){ if(b.kind==="daf") return b.t+" "+id+"a"; if(b.kind==="part"){ const p=parts&&parts[id-1]; return p ? p.t.indexOf(b.t)===0 ? p.t : b.t+", "+p.t : b.t; } return b.t+" "+id; }
function packSel(arr){ const a=[...new Set(arr.map(Number))].filter(x=>x>0).sort((x,y)=>x-y); const out=[]; for(let i=0;i<a.length;){ let j=i; while(j+1<a.length && a[j+1]===a[j]+1) j++; out.push(i===j ? String(a[i]) : a[i]+"-"+a[j]); i=j+1; } return out.join(","); }
function unpackSel(str){ const out=[]; String(str||"").split(",").forEach(p=>{ if(!p) return; const [x,y]=p.split("-").map(Number); if(y){ for(let i=x;i<=y && out.length<5000;i++) out.push(i); } else if(x) out.push(x); }); return out; }
function freeLabel(c, L){
  const TT = window.T[L] || window.T.he, a = unpackSel(c.sel), kind = c.kind || "perek";
  const bookName = L==="he" ? (c.bookHe||c.book) : c.book;
  const b = c.subject && bookByTitle(c.subject, c.book);
  if(b && b.kind!=="part" && a.length === (b.n-b.start+1)) return bookName+" - "+TT.wholeBook;
  if(kind==="part") return bookName+" - "+a.length+" "+TT.unitMany.part;
  const rng = packSel(a).split(",").map(r=>r.split("-").map(x=>numFmt(+x,L)).join("-")).join(", ");
  return bookName+", "+(a.length===1 ? TT.unitOne[kind] : TT.unitMany[kind])+" "+rng;
}

/* ---------- routing ----------
   Every screen has its own address (#learn, #learn/gemara, #join/goal ...) and is pushed to the browser
   history, so the browser Back button walks back through the site instead of leaving it. */
let navIdx = 0; const navStack = [];
function curHash(){ try{ return decodeURIComponent((location.hash||"").slice(1)); }catch(e){ return (location.hash||"").slice(1); } }
function routeHash(){
  if(view==="join") return W.step>0 ? "join/"+STEPS[W.step] : "join";
  if(view==="learn") return learnSubj ? "learn/"+learnSubj : "learn";
  if(view==="read") return "read/"+(readSubj||"x")+"/"+readRef;
  return view==="home" ? "" : view;
}
function syncUrl(replace){
  const h = routeHash();
  if(!replace && curHash()===h) return;
  const url = location.pathname + location.search.replace(/[?&]finishSignIn=1/,"") + (h ? "#"+encodeURI(h) : "");
  try{
    if(replace){ history.replaceState({i:navIdx},"",url); navStack[navIdx]=h; }
    else { navIdx++; navStack.length=navIdx; navStack.push(h); history.pushState({i:navIdx},"",url); }
  }catch(e){}
}
/* go back to `h` the way the browser would, if that is the previous page; otherwise open it as a new step */
function backTo(h, open){ if(navIdx>0 && navStack[navIdx-1]===h) history.back(); else open(); }
function showView(v){
  view=v; document.querySelectorAll(".view").forEach(x=>x.classList.remove("on")); $("#v-"+v).classList.add("on");
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on", (a.dataset.go===v && v==="me") || (a.dataset.route==="learn" && (v==="learn"||v==="read"))));
}
function go(v, anchor, opts){
  opts = opts || {};
  showView(v);
  if(v==="join"){ W._replace = !!opts.replace; renderWizard(); }
  else { if(v==="me") renderMe(); if(v==="learn") renderLearn(); if(v==="read") renderRead(); syncUrl(!!opts.replace); }
  if(anchor){ const a=document.getElementById(anchor); if(a) setTimeout(()=>a.scrollIntoView({behavior:"smooth"}),30); } else if(!opts.keepScroll) window.scrollTo(0,0);
}
/* open an address: "", "learn", "learn/tanach", "read/tanach/Ruth.1", "join/goal", "me" */
function navigate(h, opts){
  opts = opts || {};
  const parts = (h||"").split("/"), a = parts[0];
  if(a==="learn"){ learnSubj = subjById(parts[1]) ? parts[1] : null; return go("learn", null, opts); }
  if(a==="read" && parts.length>2){ readSubj = parts[1]; readRef = parts.slice(2).join("/"); return go("read", null, opts); }
  if(a==="me") return go("me", null, opts);
  if(a==="join"){
    const doneI = STEPS.length-1;
    let i = parts[1] ? STEPS.indexOf(parts[1]) : 0; if(i<0) i=0;
    if(W.step===doneI && i<doneI){ W=freshWizard(); LS.del("atgar_draft"); return go("home", null, {replace:true}); }
    if(view==="join") captureDetails();
    const c = clampStep(i); W.step = c;
    return go("join", null, {replace: opts.replace || c!==i});
  }
  return go("home", null, opts);
}
function clampStep(i){
  const verified = !!(S.auth && S.auth.verified);
  if(i>=1 && !W.track) return 0;
  if(i>=2 && !verified) return 1;
  if(i>=3 && !W.subject) return 2;
  if(i>=4 && (W.subject==="custom" ? !W.customText : W.optIdx===-1 ? !(W.free && W.free.sel && W.free.sel.length) : W.optIdx==null)) return 3;
  if(i===STEPS.length-1 && W.step!==i) return 4;
  return i;
}

  const r=e.target.closest("[data-route]");

  go(g.dataset.go, g.dataset.anchor);

function authErr(e){
  const c = (e && e.code) || "";
  if(c.includes("email-already-in-use")) return t("errInUse");
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return t("errCreds");
  if(c.includes("weak-password")) return t("passHint");
  if(c.includes("invalid-email")) return t("errEmail");
  if(c.includes("too-many-requests")) return t("errTooMany");
  return t("authErr");
}

  else { if(W.optIdx==null){ el.innerHTML=""; return; } const o=subjById(W.subject).opts[W.track][W.optIdx]; n=W.n; u=unitLabel(o.u); if(o.u==="pct"){ el.innerHTML=`<div class="pace"><div>${esc(t("paceA",{d:nf(daysLeft())}))}</div></div>`; return; } }
  const d=Math.max(1,daysLeft()); const perDay=n/d; let r, per;

function bindWizard(){
  const box=$("#wiz");
  box.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{ W.track=b.dataset.track; if(W.optIdx!==-1) W.optIdx=null; W.step = (S.auth&&S.auth.verified) ? afterSignin() : 1; renderWizard(); window.scrollTo(0,0); });
  box.querySelectorAll("[data-subj]").forEach(b=>b.onclick=()=>{ W.subject=b.dataset.subj; W.optIdx=null; if(W.subject==="custom") W.n=W.n||10; W.step++; renderWizard(); window.scrollTo(0,0); });
  box.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{ W.optIdx=+b.dataset.opt; W.n = W.optIdx===-1 ? ((W.free&&W.free.subj===W.subject&&W.free.sel||[]).length) : subjById(W.subject).opts[W.track][W.optIdx].n; renderWizard(); });
  box.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{ captureDetails(); const k=b.dataset.seg,v=b.dataset.val; if(k==="gender") W.details.gender=v; else if(k==="sector") W.details.sector = W.details.sector===v ? "" : v; else W.rem[k]=v; renderWizard(); });
  ["c-n","c-u","c-what"].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener("input",()=>{ W.customText=$("#c-what").value; W.customUnit=$("#c-u").value; W.n=Math.max(1,parseInt($("#c-n").value)||1); renderPace(); saveDraft(); }); });
  box.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act, b));

function captureDetails(){

  const d=W.details; [["age","age"],["city","city"],["comm","community"],["ded","ded"],["phone","phone"]].forEach(([id,k])=>{ const val=v("d-"+id); if(val!==undefined) d[k]=val; });
  const nm=v("d-name"); if(nm!==undefined) W.name=nm;
  const c=document.getElementById("d-consent"); if(c) W.consent=c.checked;

function setErr(m){ const e=$("#err"); if(e) e.textContent=m; return false; }
async function act(a, btn){
  if(a==="back"){
    captureDetails();
    let p = W.step-1; if(STEPS[p]==="signin" && S.auth && S.auth.verified) p--;
    if(p<0){ if(navIdx>0) history.back(); else go("home"); return; }
    const h = "join"+(p>0?"/"+STEPS[p]:"");
    backTo(h, ()=>{ W.step=p; renderWizard(); window.scrollTo(0,0); });
    return;
  }
  const em = () => (($("#a-email")||{}).value||"").trim();
  const pw = () => (($("#a-pass")||{}).value||"");
  const keep = () => { const n=$("#a-name"); if(n) W._aname=n.value.trim(); W._aemail=em(); };
  if(a==="google"){
    if(!LIVE()){ toast(t("demoGoogle")); W._authMode="signup"; renderWizard(); return; }
    saveDraft();
    try{ await window.Store.signInGoogle(); }catch(e){ console.warn(e); setErr(authErr(e)); }
    return;
  }
  if(a==="mode-signup"||a==="mode-login"){ keep(); W._authMode=a.slice(5); renderWizard(); return; }
  if(a==="signup"){
    keep(); const name=W._aname, email=W._aemail, pass=pw();
    if(!name) return setErr(t("errName"));
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr(t("errEmail"));
    if(pass.length<8) return setErr(t("passHint"));
    btn.disabled=true; saveDraft();
    try{ await window.Store.signUpEmail(name, email, pass); W.name=name; }catch(e){ console.warn(e); btn.disabled=false; setErr(authErr(e)); }
    return;
  }
  if(a==="login"){
    keep(); const email=W._aemail, pass=pw();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr(t("errEmail"));
    if(!pass) return setErr(t("errCreds"));
    btn.disabled=true; saveDraft();
    try{ await window.Store.signInEmail(email, pass); }catch(e){ console.warn(e); btn.disabled=false; setErr(authErr(e)); }
    return;
  }
  if(a==="reset"){
    keep(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(W._aemail)) return setErr(t("errEmailFirst"));
    try{ await window.Store.resetPassword(W._aemail); toast(t("resetSent")); setErr(t("resetSent")); }catch(e){ setErr(authErr(e)); }
    return;
  }
  if(a==="verified"){
    btn.disabled=true;
    try{ const ok = await window.Store.checkVerified(); if(!ok){ btn.disabled=false; setErr(t("notVerifiedYet")); } }catch(e){ btn.disabled=false; setErr(authErr(e)); }
    return;
  }
  if(a==="resend"){
    try{ await window.Store.resendVerification(); toast(t("resent")); }catch(e){ setErr(authErr(e)); }
    return;
  }
  if(a==="finishlink"){
    const em=($("#f-linkmail").value||"").trim();
    try{ await window.Store.finishEmailLink(em); }catch(e){ setErr(t("authErr")); }
    return;
  }
  if(a==="signout"){ await window.Store.signOut(); renderWizard(); return; }
  if((a==="smaller"||a==="bigger") && W.optIdx===-1) return;
  if(a==="smaller"||a==="bigger"){ const ti=TRACKS.indexOf(W.track)+(a==="bigger"?1:-1); if(ti<0||ti>2) return; W.track=TRACKS[ti]; W.n=subjById(W.subject).opts[W.track][W.optIdx].n; renderWizard(); toast(t("trackName")[W.track]); return; }
  if(a==="inc"||a==="dec"){ const o=subjById(W.subject).opts[W.track][W.optIdx]; const step=o.n>=50?5:1; W.n=Math.max(1,Math.min(9999,W.n+(a==="inc"?step:-step))); $("#nOut").textContent=nf(W.n)+" "+unitLabel(o.u); renderPace(); saveDraft(); return; }
  if(a==="next"){
    const s=STEPS[W.step];
    if(s==="goal" && W.optIdx===-1 && !(W.free && W.free.sel && W.free.sel.length)) return setErr(t("errFree"));
    if(s==="goal" && W.subject==="custom"){ W.customText=$("#c-what").value.trim(); W.customUnit=$("#c-u").value.trim()||t("customUPh"); W.n=Math.max(1,parseInt($("#c-n").value)||1); if(!W.customText) return setErr(t("errCustom")); }
    if(s==="details"){
      captureDetails();
      if(!(S.auth&&S.auth.name) && !W.name) return setErr(t("errName"));
      if(W.rem.ch!=="mail" && !/\d{9,}/.test(W.details.phone.replace(/\D/g,""))) return setErr(t("errPhone"));
      if(!W.consent) return setErr(t("errConsent"));
      btn.disabled=true; btn.textContent=t("saving");
      try{ await commit(); }catch(e){ console.warn(e); btn.disabled=false; btn.textContent=t("commit"); return setErr(t("saveErr")); }
      W.step++; LS.del("atgar_draft"); renderWizard(); window.scrollTo(0,0); return;
    }
    W.step = (s==="signin") ? afterSignin() : W.step+1; renderWizard(); window.scrollTo(0,0);
  }
}
function freeCommitment(){
  const F=W.free||{}, b=bookOf(F.subj||W.subject, F.bi); if(!b) return {label:{}};
  const sel=packSel(F.sel||[]), u=b.kind;
  const base={track:W.track, subject:W.subject, optIdx:-1, n:(F.sel||[]).length, u, customText:"", customUnit:"", ded:(W.details&&W.details.ded)||"", book:b.t, bookHe:b.he, sel, kind:b.kind, doneSel:""};
  base.label={he:labelFor(base,"he"), en:labelFor(base,"en")};
  return base;
}
async function commit(){
  const isCustom = W.subject==="custom";
  if(W.optIdx===-1){
    const c=freeCommitment();
    const commitment=Object.assign(c, {unitLabel:{he:U.he[c.u], en:U.en[c.u]}, start:new Date().toISOString()});
    return commitWith(commitment);
  }
  const o = isCustom?null:subjById(W.subject).opts[W.track][W.optIdx];
  const base = {track:W.track, subject:W.subject, optIdx: isCustom?null:W.optIdx, n:W.n, u: isCustom?"custom":o.u, customText: isCustom?W.customText:"", customUnit: isCustom?W.customUnit:"", ded:W.details.ded||""};

/* reader: shows the actual text inside the site, from Sefaria's free public API */
const readCache = {};
function cleanHTML(html){
  const tpl=document.createElement("template"); tpl.innerHTML=String(html);
  const keep={B:1,STRONG:1,I:1,EM:1,BR:1,SMALL:1,BIG:1};
  const walk=n=>{ let out=""; n.childNodes.forEach(c=>{
    if(c.nodeType===3) out+=esc(c.textContent);
    else if(c.nodeType===1){
      if(c.tagName==="SUP" || (c.classList && (c.classList.contains("footnote")||c.classList.contains("footnote-marker")))) return;
      const inner=walk(c);
      if(keep[c.tagName]){ const tg=c.tagName.toLowerCase(); out+= tg==="br" ? "<br>" : `<${tg}>${inner}</${tg}>`; } else out+=inner;
    } }); return out; };
  return walk(tpl.content);
}
function flat(x){ return Array.isArray(x) ? x.flatMap(flat) : [x]; }
function readerHead(sb){
  return `<button type="button" class="back crumb" data-act-learn="tosubj">${backArrow()} ${esc(t("backTo",{x: sb ? sb[lang] : t("allSubjects")}))}</button>`;
}
async function renderRead(){
  const box=$("#reader"); if(!box) return;
  const sb = subjById(readSubj), ref = readRef;
  box.innerHTML = readerHead(sb) + `<div class="reader"><p class="reader-load">${esc(t("readerLoading"))}</p></div>`;
  let d = readCache[ref];
  if(!d){
    try{
      const r = await fetch("https://www.sefaria.org/api/v3/texts/"+encodeURIComponent(ref.replace(/_/g," "))+"?version=hebrew&return_format=text_only");
      d = await r.json(); if(!d || !d.versions || !d.versions.length) throw new Error("no text");
      readCache[ref]=d;
    }catch(e){
      if(view!=="read" || readRef!==ref) return;
      box.innerHTML = readerHead(sb) + `<div class="reader"><p class="reader-load">${esc(t("readerErr"))}</p><a class="btn btn-gold btn-sm" href="${esc(sefariaUrl(ref))}" target="_blank" rel="noopener">${esc(t("openSefaria"))} ↗</a></div>`;
      return;
    }
  }
  if(view!=="read" || readRef!==ref) return;
  const v = d.versions[0];
  const paras = flat(v.text).filter(x=>typeof x==="string" && x.trim());
  const nav = (dir)=>{ const target = d[dir]; return target ? `<button type="button" class="btn btn-ghost btn-sm" data-read-to="${esc(target)}">${dir==="prev"?backArrow()+" "+esc(t("readerPrev")):esc(t("readerNext"))+" "+arrow()}</button>` : "<span></span>"; };
  box.innerHTML = readerHead(sb) + `<article class="reader" lang="he" dir="rtl">
    <div class="reader-top"><div><div class="eyebrow">${esc(sb ? sb.he : "")}</div><h1>${esc(d.heRef || d.ref)}</h1></div><a class="btn btn-ghost btn-sm" href="${esc(sefariaUrl(d.ref||ref))}" target="_blank" rel="noopener">${esc(t("openSefaria"))} ↗</a></div>
    <ol class="reader-text">${paras.map(p=>`<li>${cleanHTML(p)}</li>`).join("")}</ol>
    <div class="reader-nav">${nav("prev")}${nav("next")}</div>
    <p class="reader-src">${esc(t("readerSrc"))}${v.versionTitle?` · ${esc(v.versionTitle)}`:""}</p>
  </article>
  ${sb?`<div class="panel reader-cta"><b>${esc(t("readerCta"))}</b><button type="button" class="btn btn-gold btn-sm" data-act-learn="tosubj">${esc(t("readerCtaBtn",{x:sb[lang]}))} ${arrow()}</button></div>`:""}`;
}

  if(e.target.closest("[data-act2='more']")){ W=freshWizard(); prefillCommunity(); W.step = 0; go("join"); return; }
  const a3=e.target.closest("[data-act3]");
  if(a3){ if(a3.dataset.act3==="signout"){ await window.Store.signOut(); go("home"); } else if(a3.dataset.act3==="google"){ if(!LIVE()){ toast(t("demoGoogle")); return; } try{ await window.Store.signInGoogle(); }catch(err){ toast(t("authErr")); } } else if(a3.dataset.act3==="emaillogin"){ W=freshWizard(); W.track="seed"; W.step=1; W._authMode="login"; W._fromMe=true; go("join"); } return; }
  const l=e.target.closest("[data-log]");
  if(l){ const cm=S.commitments.find(x=>x.id===l.dataset.log); const step=cm.u==="pct"?10:1; const v=Math.min(cm.n,(cm.done||0)+step); await saveProgress(cm, v); return; }
  const s=e.target.closest("[data-set]");
  if(s){ const cm=S.commitments.find(x=>x.id===s.dataset.set); const v=parseFloat(document.getElementById("set-"+cm.id).value); if(!isNaN(v)) await saveProgress(cm, Math.max(0,Math.min(cm.n,v))); return; }
  const rb=e.target.closest("[data-rem]");
  if(rb){ await remAction(rb.dataset.rem); return; }
  const sg=e.target.closest("#remPanel [data-seg]");
  if(sg){ const ph=document.getElementById("m-phone"); if(ph) remDraft.phone=ph.value; remDraft.rem[sg.dataset.seg]=sg.dataset.val; renderMe(); return; }
});
function markHTML(c){
  const b = bookByTitle(c.subject, c.book) || {t:c.book, he:c.bookHe, kind:c.kind||"perek", n:0, start:1};
  const parts = b.kind==="part" ? partsCache[b.t] : null;
  if(b.kind==="part" && !parts) loadParts(b.t).then(()=>{ if(view==="me") renderMe(); }).catch(()=>{});
  const ids = unpackSel(c.sel), done = new Set(unpackSel(c.doneSel));
  const next = ids.find(id=>!done.has(id));
  return `<p style="font-size:14px;color:var(--cream-faint)">${esc(t("markHint",{u1:t("unitOne")[b.kind]}))}</p>
    <div class="u-grid ${b.kind==="part"?"parts":""}">${ids.map(id=>`<button type="button" class="u-chip ${done.has(id)?"done":""}" data-mark="${esc(c.id)}|${id}" aria-pressed="${done.has(id)}">${done.has(id)?"✓ ":""}${esc(unitName(b,id,parts))}</button>`).join("")}</div>
    ${next!=null?`<div><button type="button" class="btn btn-gold btn-sm" data-route="read/${esc(c.subject)}/${esc(unitRef(b,next,parts).replace(/ /g,"_"))}">${esc(t("readNext",{x:t("unitOne")[b.kind]+" "+unitName(b,next,parts)}))} 📖</button></div>`:""}`;
}
document.addEventListener("click", async e=>{
  const m=e.target.closest("[data-mark]"); if(!m) return;
  const [cid, idS]=m.dataset.mark.split("|"); const cm=S.commitments.find(x=>x.id===cid); if(!cm) return;
  const id=+idS, done=new Set(unpackSel(cm.doneSel)); done.has(id)?done.delete(id):done.add(id);
  const prev={done:cm.done, doneSel:cm.doneSel}; cm.doneSel=packSel([...done]); cm.done=Math.min(cm.n, done.size); renderMe();
  try{ await window.Store.updateProgress(cm.id, cm.done, cm.doneSel); if(cm.done>=cm.n) toast(t("doneS")); }
  catch(err){ cm.done=prev.done; cm.doneSel=prev.doneSel; renderMe(); toast(t("saveErr")); }
});
async function saveProgress(cm, v){
  const prev=cm.done||0; cm.done=v; renderMe();
  try{ await window.Store.updateProgress(cm.id, v); toast(v>=cm.n?t("doneS"):"✓"); }
  catch(e){ cm.done=prev; renderMe(); toast(t("saveErr")); }
}
async function remAction(k){
  const me=S.me||(S.me={});
  if(k==="edit"){ remEditing=true; remDraft={rem:Object.assign({ch:"wa",fr:"daily",tm:"evening"},me.rem||{}), phone:(me.profile&&me.profile.phone)||""}; renderMe(); return; }
  if(k==="cancel"){ remEditing=false; renderMe(); return; }
  if(k==="save"){
    const ph=document.getElementById("m-phone"); if(ph) remDraft.phone=ph.value.trim();
    if(remDraft.rem.ch!=="mail" && !/\d{9,}/.test((remDraft.phone||"").replace(/\D/g,""))) return setErr(t("errPhone"));
    try{
      if(remDraft.phone !== ((me.profile&&me.profile.phone)||"")){ me.profile=Object.assign({},me.profile,{phone:remDraft.phone}); if(window.Store.updatePhone) await window.Store.updatePhone(remDraft.phone); }
      await window.Store.updateReminders(remDraft.rem, true); me.rem=remDraft.rem; me.reminderActive=true; remEditing=false; renderMe(); toast(t("remSaved"));
    }catch(e){ setErr(t("saveErr")); }
    return;
  }
  if(k==="pause"||k==="resume"){
    try{ await window.Store.updateReminders(me.rem||{ch:"mail",fr:"weekly",tm:"evening"}, k==="resume"); me.reminderActive = k==="resume"; renderMe(); toast(t("remSaved")); }catch(e){ toast(t("saveErr")); }
  }
}

/* ---------- hero sparks ---------- */
function sparks(){
  const cv=$("#sparks"); if(!cv) return; const ctx=cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W2,H2,P=[]; const dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){ const r=cv.getBoundingClientRect(); W2=r.width; H2=r.height; cv.width=W2*dpr; cv.height=H2*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); const count=Math.round(Math.min(140,W2/8)); P=Array.from({length:count},()=>mk(true)); }
  function mk(init){ return {x:Math.random()*W2, y: init?Math.random()*H2:H2+10, r:.6+Math.random()*1.8, v:.15+Math.random()*.55, a:.2+Math.random()*.7, w:Math.random()*Math.PI*2}; }
  function draw(){ ctx.clearRect(0,0,W2,H2); for(const p of P){ p.y-=p.v; p.w+=.02; p.x+=Math.sin(p.w)*.25; if(p.y<-10) Object.assign(p,mk(false)); const fade=Math.min(1,p.y/(H2*.35)); ctx.beginPath(); ctx.fillStyle=`rgba(236,211,145,${p.a*fade})`; ctx.shadowColor="rgba(236,180,90,.9)"; ctx.shadowBlur=8; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); } if(!reduce) requestAnimationFrame(draw); }
  size(); addEventListener("resize",size); draw();
}

/* ---------- boot ---------- */
function prefillCommunity(){ const c=LS.get("atgar_comm"); if(c && !W.details.community) W.details.community=c; }
function captureParams(){
  const q=new URLSearchParams(location.search);
  const ref=q.get("ref"); if(ref && /^[a-z0-9]{4,12}$/i.test(ref)) LS.set("atgar_ref", ref);
  const comm=q.get("c"); if(comm) LS.set("atgar_comm", comm.slice(0,80));
  const h=(location.hash||"").slice(1);
  if(/^ref-[a-z0-9]{4,12}$/i.test(h)) LS.set("atgar_ref", h.slice(4));
}
function boot(){
  const l=LS.get("atgar_lang"); if(l==="en"||l==="he") lang=l;
  captureParams();
  const draft=loadDraft(); if(draft){ W=draft; W._linkSent=null; }
  prefillCommunity();
  applyLang(); sparks();
  window.Store.watchStats(st=>{ S.stats=st; renderStats(); });
  window.Store.init(async user=>{
    S.auth=user; await refreshMine(); S.ready=true;
    if(view==="join"){ if(user && user.verified && W._fromMe){ W=freshWizard(); LS.del("atgar_draft"); go("me"); return; } if(user && user.verified && STEPS[W.step]==="signin"){ W.step = afterSignin(); W._replace = true; } renderWizard(); }
    if(view==="me") renderMe();
  });
  const h=curHash();
  navStack[0]=""; try{ history.replaceState({i:0},"",location.href); }catch(e){}
  if(h && !/^ref-/i.test(h) && h!=="home") navigate(h, {replace:true});
  else if(h) { try{ history.replaceState({i:0},"",location.pathname+location.search); }catch(e){} }
}
if(window.Store) boot(); else window.addEventListener("store-ready", boot, {once:true});
})();

</script>
