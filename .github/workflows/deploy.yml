# Publishes the site (Firebase Hosting) and the Firestore security rules on every push to main.
# Signs in to Google Cloud without any stored key (Workload Identity Federation) - set up once by app/setup_autodeploy.sh.
name: Deploy site
on:
  push:
    branches: [main]
    paths:
      - "app/firebase/public/**"
      - "app/firebase/firestore.rules"
      - "app/firebase/firebase.json"
      - "app/deploy_rest.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1071296629812/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deployer@atgar-hasiyum.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publish site and security rules
        run: |
          gcloud config set project atgar-hasiyum
          python3 app/deploy_rest.py
